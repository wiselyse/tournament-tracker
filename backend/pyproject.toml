[project]
name = "wsf-tournament"
version = "0.1.0"
description = "WSF tournament tracker: rules engine and API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["wsf_tournament", "harness"]
